[program:julia-voice]
command=/opt/julia/bin/start-julia-voice
directory=/root/julia_voice_v2/run/rmd3g-c1-b18d1e42
autostart=true
autorestart=unexpected
startsecs=120
startretries=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/julia/julia-voice.log
stderr_logfile=/var/log/julia/julia-voice.err
stdout_logfile_maxbytes=50MB
stderr_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile_backups=5
environment=JULIA_VOICE_ENV="/etc/julia/julia-voice.env",JULIA_VOICE_PREFLIGHT="/opt/julia/bin/julia-voice-preflight"

[program:julia-voice-watchdog]
command=/opt/julia/bin/julia-voice-watchdog
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/julia/julia-voice-watchdog.log
stderr_logfile=/var/log/julia/julia-voice-watchdog.err
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile_backups=5
environment=JULIA_VOICE_HEALTH="/opt/julia/bin/julia-voice-health",JULIA_VOICE_PID_FILE="/tmp/julia-voice-supervisor/s2s.pid"
